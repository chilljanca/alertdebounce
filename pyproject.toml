[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chilljanca-alertdebounce"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别告警的抖动抑制上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "chilljanca" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://chilljanca.github.io"
Repository = "https://github.com/chilljanca/alertdebounce"
Issues = "https://github.com/chilljanca/alertdebounce/issues"

[project.scripts]
alertdebounce = "alertdebounce:main"

[tool.setuptools]
py-modules = ["alertdebounce"]
